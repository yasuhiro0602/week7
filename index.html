<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TODOリスト</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
  
  <div class="max-w-md mx-auto bg-white rounded-lg shadow-md p-6">
    <h2 class="text-2xl font-bold mb-4 text-gray-800 text-center">TODOリスト</h2>
    
    <div class="flex gap-2 mb-6">
      <input type="text" id="taskInput" class="flex-1 border border-gray-300 rounded p-2 focus:outline-none focus:border-blue-500" placeholder="新しいタスクを入力...">
      <button onclick="addTask()" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 transition font-bold">追加</button>
    </div>

    
    <ul id="taskList" class="space-y-3">
      
    </ul>
  </div>

  <script>
    function addTask() {
     
      const input = document.getElementById('taskInput');
      const taskText = input.value.trim(); // trim()で前後の余白を削除

     
      if (taskText === '') {
        return;
      }

     
      const ul = document.getElementById('taskList');
      const li = document.createElement('li');
      li.className = "flex items-center justify-between p-3 border rounded bg-gray-50";

     
      const span = document.createElement('span');
      span.textContent = taskText;
      span.className = "flex-1 break-all transition-all duration-300";

      
      const buttonDiv = document.createElement('div');
      buttonDiv.className = "flex gap-2 ml-4";

     
      const completeBtn = document.createElement('button');
      completeBtn.textContent = '完了';
      completeBtn.className = "text-sm bg-green-500 text-white px-3 py-1 rounded hover:bg-green-600";
      completeBtn.onclick = function() {
       
        span.classList.toggle('line-through');
        span.classList.toggle('text-gray-400');
      };

      
      const deleteBtn = document.createElement('button');
      deleteBtn.textContent = '削除';
      deleteBtn.className = "text-sm bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600";
      deleteBtn.onclick = function() {
       
        if (confirm(`「${taskText}」を削除してもよろしいですか？`)) {
          ul.removeChild(li);
        }
      };

      
      buttonDiv.appendChild(completeBtn);
      buttonDiv.appendChild(deleteBtn);
      li.appendChild(span);
      li.appendChild(buttonDiv);
      ul.appendChild(li);

    
      input.value = '';
    }
  </script>

</body>
</html>
